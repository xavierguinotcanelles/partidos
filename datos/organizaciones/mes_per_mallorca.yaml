notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 7), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «MÉS PER MALLORCA» (MÉS), inscrita el 12/07/2013 (Palma (Illes Balears)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2010 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Ámbito insular (Mallorca): el esquema no tiene «insular» y se usa «provincial». Wikidata da dos inicios (2010 y 2021-11-26); se toma el primero. Sin color: Wikidata da dos."
