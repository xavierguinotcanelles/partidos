notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 7), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «VERDS EQUO DEL PAÍS VALENCIÀ» (VERDSEQUO), inscrita el 30/11/2004 (València (Valencia/Vàlencia)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2014 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Ámbito Comunitat Valenciana. Wikidata Q18397954 (etiqueta «Verds» / «Verds - Compromís», alias «Verds Equo del País Valencià»)."
