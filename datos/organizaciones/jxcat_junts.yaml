notas: "Coalición electoral «JUNTS» constituida ante la JEC en tres generales, siempre con ámbito Cataluña, circunscripciones de Barcelona, Tarragona, Lleida y Girona, y denominación por circunscripción «JUNTS PER CATALUNYA - JUNTS»: 28-04-2019 (C8, pacto firmado en Barcelona el 13-03-2019 por el PDeCAT, CDC y Junts per Catalunya), 10-11-2019 (C4, pacto de 27-09-2019 por el PDeCAT y Junts per Catalunya) y 23-07-2023 (C8, pacto de 8-06-2023 por Junts per Catalunya, Moviment d'Esquerres de Catalunya y Demòcrates de Catalunya; registro de entrada JEC 2023005804 de 09-06-2023). Una ficha para las tres (ADR-0022, punto 3): mismo nombre, siglas y ámbito, y Wikidata (Q62596367) tiene una sola entrada. Candidatura en Interior: `JxCAT-JUNTS` «JUNTS PER CATALUNYA-JUNTS» (2019-04 código 000049; 2019-11 000041; 2023 000057). Proclamación de 2023 (BOE-A-2023-15066): «JUNTS PER CATALUNYA-JUNTS» en Girona (siglas «J x CAT-JUNTS»), Lleida y Tarragona («JxCAT-JUNTS»), pero «JUNTS (JUNTS)» en Barcelona (candidatura 10, pág. 90033). Sin baja: la coalición se constituye para cada elección. Color: P465 de Wikidata."
