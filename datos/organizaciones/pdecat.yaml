notas: "Alta 10-07-2016: Wikidata (P571) y la fecha de las dos crónicas (Ara y VilaWeb, 10-07-2016); Ara dice que el nombre lo eligieron los «congressistes» «aquest dissabte al matí». Baja 28-10-2023: solo Wikidata (P576), sin contrastar y fuera del periodo de esta tanda. Pendiente del Registro (ADR-0021): la descarga del Registro de 2026-10-17 no trae ninguna inscripción con «PARTIT DEMOCRATA» ni «PDECAT». Tornos (2016, pág. 208) da como presidente a Artur Mas y como coordinadora general a Marta Pascal. Ver la relación `cdc_refundacion_en_pdecat_2016`. Color: P465 de Wikidata."
