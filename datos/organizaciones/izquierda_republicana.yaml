notas: "Registro de Partidos (descarga 2026-10-17): «IZQUIERDA REPUBLICANA (I.R.)», inscrita el 10/11/1977 (Madrid (Madrid)); `alta` es esa fecha de inscripción, que puede no ser la fundación. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Fundador de IU en 1986 según el programa electoral de IU para el 22-06-1986. Sin Wikidata: la entidad Q2351459 es la Izquierda Republicana de 1934-1959, no esta inscripción de 1977."
