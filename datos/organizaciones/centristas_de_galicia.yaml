notas: "Alta (1985) y baja (1991): solo Wikidata (P571/P576), sin contrastar; no aparece en la descarga del Registro de Partidos del 2026-10-17 (ni como «CENTRISTAS DE GALICIA»): pendiente del Registro (ADR-0021). Con el PP en Ourense en las generales de 1989 (Interior 1989, fichero 03, código 000098 `PP-C DE G` «PARTIDO POPULAR CENTRISTAS DE GALICIA», acumulada a 000002 PP). En 1986 Interior da en Galicia la candidatura 000010 `AP-PDP-PL-C` «COALICION POPULAR», con la sigla cortada: ninguna fuente copiada dice qué es la «C», y no se carga relación. Color: P465 de Wikidata. Ámbito: Galicia."
