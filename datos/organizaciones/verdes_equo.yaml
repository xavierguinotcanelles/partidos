notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 6), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «VERDES EQUO» (EQUO), inscrita el 18/02/2011 (Madrid (Madrid)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2011-06-04 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Color: P465 de Wikidata. En Wikidata con la etiqueta «Partido Verde» y los alias Equo y Verdes Equo; la fecha de inicio es la de Equo."
