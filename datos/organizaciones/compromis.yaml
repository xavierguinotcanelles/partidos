notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 6), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «COALICIO COMPROMIS» (CCPV), inscrita el 10/06/2010 (València (Valencia/Vàlencia)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2010-01-25 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Color: P465 de Wikidata. Ámbito Comunitat Valenciana. Pese al nombre, Wikidata lo clasifica como partido; el tipo (partido, federación o coalición) espera al Registro."
