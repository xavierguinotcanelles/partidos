notas: "Una ficha para Unidos Podemos (2016) y Unidas Podemos (2019) (ADR-0022): la coalición estatal de Podemos, IU y Equo cambia de nombre; ver la justificación. Alta y nombres de los dos pactos de coalición ante la JEC; cada pacto vale para una convocatoria y no da fecha de fin: baja sin fijar. Siglas de la ficha: las del pacto de 2019. Registro (descarga 2026-10-17): hay un «UNIDOS PODEMOS» inscrito el 29/09/2016, pero la coalición no es esa inscripción y el Registro no inscribe coaliciones; queda para #73."
