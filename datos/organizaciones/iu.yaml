notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 5), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «IZQUIERDA UNIDA» (I.U.), inscrita el 02/11/1992 (Madrid (Madrid)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 1986 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Color: P465 de Wikidata. Tipo federación según Wikidata (P31 federación de partidos)."
