notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 6), que no da siglas, tipo ni ámbito. Ficha pendiente del Registro (ADR-0021): alta, registro, tipo jurídico y ámbito salen de la semilla Wikidata y no están contrastados. Color: P465 de Wikidata. Ámbito Comunitat Valenciana. Wikidata Q108047697 «Més - Compromís» (alias Més Compromís, descrita como federación de partidos); hay otra entrada Q69962631 «Més Compromís» descrita como coalición electoral de 2019. Ambiguo (descarga del Registro, 2026-10-17): «MÉS-COMPROMÍS» (siglas MÉS-COMPROMÍS, València) está inscrita el 19/05/1998, no en 2021 como da Wikidata para esta organización; puede ser la inscripción del Bloc Nacionalista Valencià con otra denominación (la descarga no trae histórico), y entonces la ficha de 2021 no tendría inscripción propia. No se sube a confirmado ni se cambia el alta."
