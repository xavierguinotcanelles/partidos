    nota: "Federación de CDC y UDC: Vintró (2001, Informe Comunidades Autónomas, pág. 242) habla de «la nueva federación de CiU constituida en diciembre» y (pág. 249) de «la refundación de CiU con la conversión de la coalición en federación»; Wikidata da un segundo P571 el 02-12-2001. Registro de Partidos (descarga 2026-10-17): «CONVERGÈNCIA I UNIÓ (CiU)», C/ Còrsega, 331-333 y C/ Travessera de Gràcia, 17-21, Barcelona, inscrita el 16/05/2002. Candidaturas: 2004 000033 `CiU` «CONVERGENCIA i UNIO»; 2008 000060 y 000061; 2011 000025 y 000026 `CiU` «CONVERGÈNCIA i UNIÓ». Fin: junio de 2015 (ver la nota de la ficha)."
