notas: "Una ficha para la coalición de 1978 y la federación de 2001 (ADR-0022, punto 3): Vintró (2001, págs. 248-249) habla de «los veinte años de vida de la coalición» y de su «conversión» en federación, la misma CiU que cambia de forma; ver la justificación. Tipo de la ficha: el de su última forma (federación); el cambio de forma va en `nombres` y en las relaciones de CDC y UDC (`coaligada_en` hasta 2001, `miembro_de` desde 2001). Fin: el 17-06-2015 la dirección de UDC decide salir del Govern y CDC da «per trencada la federació» (VilaWeb y Nació Digital, 17-06-2015); Wikidata (P576) da el 18-06-2015. En las generales de 2015 CDC concurre en Democràcia i Llibertat y UDC sola. Baja `dudoso` y pendiente del Registro (ADR-0021): la descarga del Registro de 2026-10-17 sigue dando la inscripción de 2002, sin baja; ninguna fuente copiada documenta la liquidación de la federación. Color: P465 de Wikidata (el mismo que CDC)."
