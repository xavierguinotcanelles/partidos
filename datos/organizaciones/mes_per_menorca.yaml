notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 7), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «MÉS PER MENORCA» (MxMe), inscrita el 25/01/2019 (Ma¿-Mah¿n (Illes Balears)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2014-07-21 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Color: P465 de Wikidata. Ámbito insular (Menorca): el esquema no tiene «insular» y se usa «provincial». Siglas sin fijar: Wikidata da tres (MxMe, MpM, Més Menorca)."
