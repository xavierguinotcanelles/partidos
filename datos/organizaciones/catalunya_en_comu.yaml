notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 6), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «CATALUNYA EN COMÚ» (CatComú), inscrita el 12/01/2016 (Barcelona (Barcelona)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2017-01-12 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Ámbito Cataluña. Sin color: Wikidata da tres (P465)."
