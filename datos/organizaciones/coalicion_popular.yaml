    nota: "Interior 1982, fichero 03, código 000005 `AP-PDP` «ALIANZA POPULAR - PARTIDO DEMOCRATA POPULAR», con 000006, 000007, 000008 y 000086 acumuladas a 000005. Fin: ninguna fuente fecha el cambio de nombre; Montero (pág. 20) lo cuenta, sin fecha, entre 1982 y las generales de 1986. `hasta` es el día anterior a las generales del 22-06-1986, en las que ya concurre como Coalición Popular: cota (deducida), por eso `aprox`."
