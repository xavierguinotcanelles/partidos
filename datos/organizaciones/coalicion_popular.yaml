notas: "Una ficha para la coalición AP-PDP de 1982 y Coalición Popular de 1986 (ADR-0022, punto 3): Montero (1987, REIS 39, pág. 20) dice que «la coalición conservadora conoció sólo pequeños cambios: pasó a denominarse Coalición Popular […] por la presencia de un nuevo «partido», el Partido Liberal»; ver la justificación. Siglas de la ficha: las de 1986. Alta: generales del 28-10-1982 (Interior). Baja 1989: solo Wikidata (P576), sin contrastar; Montero (pág. 23) escribe en abril de 1987 que «el PDP y el PL […] rompieron el pacto de la Coalición», y en las generales de 1989 AP ya concurre como PP (Interior 1989, código 000002). Wikidata tiene dos entradas: Q3393021 (Coalición Popular, 1986-1989) y Q47014901 (coalición AP-PDP-UL, 1983); la de 1983 lleva los mismos socios principales (AP y PDP) y se lleva a wikidata_otros; ninguna fuente copiada dice en qué elecciones concurrió. En 1982 y 1986 concurrió en algunas provincias con partidos regionales (PAR, UV, UPN, PDL con UCD en 1982; UPN en 1986), que esta tanda no carga. Color: P465 de Wikidata (Q3393021)."
