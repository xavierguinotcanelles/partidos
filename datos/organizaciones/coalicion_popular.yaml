    nota: "Fecha: generales del 22-06-1986, primera candidatura con este nombre; el cambio pudo ser antes (cota, `aprox`). Interior 1986, fichero 03, código 000009 `AP-PDP-PL` «COALICION POPULAR» (con 000010 `AP-PDP-PL-C` y 000011 `AP-PL-UPN`, acumuladas a 000009). Montero (1987, pág. 20): «pasó a denominarse Coalición Popular»."
