notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 5), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «MÁS PAÍS», inscrita el 09/03/2021 (Madrid (Madrid)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2019 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Figura en la descarga, así que consta inscrita a 2026-10-17 pese a la baja de la ficha (Wikidata); la baja queda sin contrastar. Color: P465 de Wikidata. Wikidata da fin en 2023 (P576, solo año) sin sucesor; firmó el pacto el 9-06-2023."
