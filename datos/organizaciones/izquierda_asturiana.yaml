notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 8), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «IZQUIERDA ASTURIANA» (IAS), inscrita el 11/05/1992 (Oviedo (Asturias)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 1992 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Color: P465 de Wikidata. Ámbito Asturias."
