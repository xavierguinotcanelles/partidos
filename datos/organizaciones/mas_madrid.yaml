notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 6), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «MÁS MADRID», inscrita el 07/02/2019 (Madrid (Madrid)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2018-11-22 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Sin color: Wikidata da dos (P465)."
