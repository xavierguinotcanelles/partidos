notas: "Una ficha para la candidatura de 2017 y el partido de 2020 (ADR-0022, punto 3): la Gran Enciclopèdia Catalana trata a Junts per Catalunya en una sola entrada y habla de «convertir la coalició en un partit polític»; Tornos (2020, pág. 174) llama al pleito de 2020 la «batalla interna por el dominio del nombre de la coalición»; nombre, siglas y sede no cambian. Ver la justificación. Tipo de la ficha: el de su última forma (partido); la forma de coalición va en `nombres` y en `pdecat_coaligada_en_junts_2017`. Wikidata tiene dos entradas (Q97155800 partido, principal; Q43228047 alianza electoral 2017-2020). El partido inscrito en el Registro el 11-07-2018 es anterior al congreso fundacional de 2020: por qué, sin fuente copiada. Pendiente del Registro (ADR-0021): tipo, número e histórico de la inscripción. Color: P465 de Q97155800."
