notas: "Firmante del pacto de la coalición SUMAR (Anexo I, pág. 8), que no da siglas, tipo ni ámbito. Registro de Partidos (descarga 2026-10-17): «INICIATIVA DEL PUEBLO ANDALUZ» (IdPA), inscrita el 01/02/2018 (Sevilla (Sevilla)); `alta` es esa fecha de inscripción. La descarga no trae tipo ni número de inscripción: el tipo sigue sin contrastar y `registro` queda vacío. Antes: alta 2016-02 (Wikidata); la fecha del Registro es la de la inscripción vigente y puede no ser la fundación. Ámbito Andalucía. Aparece dos veces en el Anexo I con el mismo representante (pág. 8)."
